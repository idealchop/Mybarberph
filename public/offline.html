<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Barbers.ph · Offline</title>
<style>
  html,body{margin:0;background:#f5f5f7;color:#111;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
  main{max-width:402px;margin:0 auto;padding:calc(64px + env(safe-area-inset-top)) 20px 40px;text-align:center}
  img{width:72px;height:72px;border-radius:18px}
  h1{font-size:24px;letter-spacing:-.02em;margin:18px 0 6px}
  p{font-size:15px;color:#555;margin:0 0 22px;line-height:1.4}
  /* v1.0.45: same look as the app's shared Button (primary + secondary). The old font shorthand ended in "inherit" and
     invalid CSS, so the link fell back to the browser's default text size. */
  .btn{display:flex;align-items:center;justify-content:center;box-sizing:border-box;width:100%;height:48px;padding:0 20px;border-radius:999px;border:0;margin-top:10px;font-family:inherit;font-size:15px;font-weight:700;line-height:1;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .btn-primary{background:#111;color:#fff}
  .btn-secondary{background:#fff;color:#111;box-shadow:inset 0 0 0 1.5px #e3e3e8}
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>This page wasn't saved on this phone yet. Pages you opened before still work offline.</p>
  <button type="button" class="btn btn-primary" onclick="location.reload()">Try again</button>
  <a class="btn btn-secondary" href="/home">Go to Home</a>
</main>
</body>
</html>
