env:
  - variable: NEXT_PUBLIC_FIRESTORE_DATABASE_ID
    value: "barbersdb-dev"
  - variable: FIRESTORE_DATABASE_ID
    value: "barbersdb-dev"
  - variable: BARBERS_ENV
    value: "dev"
  - variable: NEXT_PUBLIC_AUTH_TEST_MODE
    value: "1"
  # AI Companion (dev only for now): Monday tips runner auth for Cloud Scheduler.
  - variable: COMPANION_CRON_SECRET
    secret: COMPANION_CRON_SECRET
  # Show the AI Companion (Home card, /companion, /api/companion/*). Also on in apphosting.prod.yaml since 2026-10-21.
  - variable: COMPANION_ENABLED
    value: "1"
  # Plan limits (walk-in cap, QR, shops, Companion questions). "0" = test phase: all features for every plan.
  - variable: PLAN_LIMITS_ENABLED
    value: "0"
  # Brevo transactional SMS + email for new online bookings (dev only for now).
  - variable: BREVO_API_KEY
    secret: BREVO_API_KEY
