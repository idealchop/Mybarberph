# Shared App Hosting config for Barbers.ph (single Firebase project: mybarberph).
# Per-environment values live in apphosting.dev.yaml / apphosting.prod.yaml,
# selected by each backend's Environment name (dev / prod).
# FIREBASE_WEBAPP_CONFIG is injected at build for the linked web app.

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: NEXT_PUBLIC_USE_EMULATORS
    value: "false"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_DATA_SOURCE
    value: "firebase"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "mybarberph"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "mybarberph.firebaseapp.com"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "mybarberph.firebasestorage.app"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_TELEMETRY_DISABLED
    value: "1"
    availability: [BUILD, RUNTIME]
